<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificare model voce</title>
  <base href="../">
  <style>
    :root { color-scheme: light dark; }
    body { font: 18px/1.5 system-ui, sans-serif; margin: 24px; max-width: 760px; }
    td, th { padding: 4px 12px; text-align: left; }
    .ok { color: #0a7a2f; font-weight: 700; }
    .bad { color: #b3261e; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Verificare model voce</h1>
  <p>Rulează modelul din <code>voice/speaker.onnx</code> pe sunetul din <code>voice/fixtures/parity.json</code> și compară amprenta cu cea calculată în Python.</p>
  <p id="status">Se încarcă…</p>
  <table id="results" hidden>
    <tr><th>Provider</th><td id="provider"></td></tr>
    <tr><th>Placă grafică (WebGPU)</th><td id="adapter"></td></tr>
    <tr><th>Cosinus cu Python (≥ 0,999)</th><td id="parity"></td></tr>
    <tr><th>Durată 3 s (p95)</th><td id="t3"></td></tr>
    <tr><th>Durată 8 s (p95, ≤ 1500 ms)</th><td id="t8"></td></tr>
  </table>
  <script src="voice/ort/ort.webgpu.min.js"></script>
  <script src="voice/echo_voice.js"></script>
  <script>
    const show = (id, text, ok) => {
      const cell = document.getElementById(id);
      cell.textContent = text;
      if (ok !== undefined) cell.className = ok ? 'ok' : 'bad';
    };

    async function p95(samples, runs) {
      const times = [];
      for (let i = 0; i < runs; i++) {
        const started = performance.now();
        await window.echoVoice.embed(samples);
        times.push(performance.now() - started);
      }
      times.sort((a, b) => a - b);
      return times[Math.min(times.length - 1, Math.ceil(0.95 * times.length) - 1)];
    }

    (async () => {
      try {
        const fixture = await (await fetch('voice/fixtures/parity.json')).json();
        const bytes = Uint8Array.from(atob(fixture.audio_b64), (c) => c.charCodeAt(0));
        const audio = new Float32Array(bytes.buffer);

        const embedding = await window.echoVoice.embed(audio);
        let dot = 0;
        for (let i = 0; i < embedding.length; i++) dot += embedding[i] * fixture.embedding[i];

        const eight = new Float32Array(8 * fixture.sample_rate);
        for (let i = 0; i < eight.length; i++) eight[i] = audio[i % audio.length];
        await window.echoVoice.embed(eight); // warm-up for this length
        const t3 = await p95(audio, 10);
        const t8 = await p95(eight, 10);

        let adapter = 'fără WebGPU';
        if (navigator.gpu) {
          const found = await navigator.gpu.requestAdapter();
          const info = found && (found.info || (found.requestAdapterInfo && await found.requestAdapterInfo()));
          adapter = info ? [info.vendor, info.architecture, info.description].filter(Boolean).join(' ') || 'necunoscută' : 'niciuna';
        }
        show('provider', window.echoVoice.provider);
        show('adapter', adapter);
        show('parity', dot.toFixed(5), dot >= 0.999);
        show('t3', `${Math.round(t3)} ms`);
        show('t8', `${Math.round(t8)} ms`, t8 <= 1500);
        document.getElementById('results').hidden = false;
        document.getElementById('status').textContent = 'Gata.';
        document.title = `parity=${dot.toFixed(5)} provider=${window.echoVoice.provider} adapter=${adapter} t3=${Math.round(t3)} t8=${Math.round(t8)}`;
      } catch (error) {
        document.getElementById('status').textContent = `Eroare: ${error}`;
        document.title = `error=${error}`;
      }
    })();
  </script>
</body>
</html>
