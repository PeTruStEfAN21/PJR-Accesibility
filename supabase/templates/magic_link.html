<!doctype html>
<html lang="ro">
  <body style="margin:0;padding:24px;background:#ffffff;color:#111111;font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:1.5">
    <h1 style="font-size:24px;margin:0 0 16px">Codul tău Echo</h1>
    <p style="margin:0 0 8px">Scrie acest cod în aplicație ca să intri în cont:</p>
    <p style="font-size:36px;font-weight:bold;letter-spacing:8px;margin:0 0 16px" aria-label="Cod: {{ .Token }}">{{ .Token }}</p>
    <p style="margin:0 0 32px">Codul expiră în 10 minute. Dacă nu ai cerut tu codul, ignoră acest email.</p>

    <h2 style="font-size:20px;margin:0 0 12px" lang="en">Your Echo code</h2>
    <p style="margin:0" lang="en">Type this code in the app to sign in. It expires in 10 minutes. If you did not ask for it, ignore this email.</p>
  </body>
</html>
